name: Build iOS App (.IPA)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA on Mac
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          mkdir -p build/Payload/35DDP257.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Apple SDK Path: $SDK_PATH"
          
          SWIFT_FILES=$(find App Authentication CarPlay DJEngine Library Spotify Utilities Views -name "*.swift" 2>/dev/null)
          
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 -sdk "$SDK_PATH" \
            $SWIFT_FILES \
            -o build/Payload/35DDP257.app/35DDP257 \
            -framework UIKit \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework MediaPlayer \
            -framework CarPlay \
            -framework LocalAuthentication \
            -framework Security \
            -parse-as-library || true

          # Info.plist degiskenlerini gercek degerleriyle degistir
          cp App/Info.plist build/Payload/35DDP257.app/Info.plist
          plutil -replace CFBundleExecutable -string "35DDP257" build/Payload/35DDP257.app/Info.plist
          plutil -replace CFBundleName -string "35DDP257" build/Payload/35DDP257.app/Info.plist
          plutil -replace CFBundlePackageType -string "APPL" build/Payload/35DDP257.app/Info.plist
          plutil -replace CFBundleDevelopmentRegion -string "en" build/Payload/35DDP257.app/Info.plist
          sed -i '' 's/\$(PRODUCT_MODULE_NAME)/35DDP257/g' build/Payload/35DDP257.app/Info.plist || true

          # Ses ve gorsel kaynaklari ekle
          cp *.mp3 build/Payload/35DDP257.app/ 2>/dev/null || true
          cp App/*.mp3 build/Payload/35DDP257.app/ 2>/dev/null || true
          cp *.png build/Payload/35DDP257.app/ 2>/dev/null || true

          chmod +x build/Payload/35DDP257.app/35DDP257

          cd build && zip -r 35DDP257.ipa Payload/
          echo "IPA Hazirlandi!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 35DDP257-IPA
          path: build/35DDP257.ipa
