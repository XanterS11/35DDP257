name: Build iOS App (.IPA)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA on Mac
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          mkdir -p build/Payload/35DDP257.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Apple SDK Path: $SDK_PATH"

          # Native iOS & CarPlay Scene Launcher with True Fullscreen
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <AVFoundation/AVFoundation.h>
          #import <CarPlay/CarPlay.h>

          static void SetupWebViewOnViewController(UIViewController *vc) {
              CGRect screenBounds = [[UIScreen mainScreen] bounds];
              vc.view.frame = screenBounds;
              vc.view.backgroundColor = [UIColor colorWithRed:0.02 green:0.03 blue:0.05 alpha:1.0];
              
              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              config.allowsInlineMediaPlayback = YES;
              config.mediaTypesRequiringUserActionForPlayback = WKAudiovisualMediaTypeNone;
              
              WKWebView *webView = [[WKWebView alloc] initWithFrame:screenBounds configuration:config];
              webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              webView.scrollView.bounces = NO;
              webView.scrollView.contentInsetAdjustmentBehavior = UIScrollViewContentInsetAdjustmentNever;
              webView.backgroundColor = [UIColor colorWithRed:0.02 green:0.03 blue:0.05 alpha:1.0];
              webView.opaque = NO;
              
              NSString *htmlPath = [[NSBundle mainBundle] pathForResource:@"index" ofType:@"html"];
              if (htmlPath && [[NSFileManager defaultManager] fileExistsAtPath:htmlPath]) {
                  NSURL *fileURL = [NSURL fileURLWithPath:htmlPath];
                  [webView loadFileURL:fileURL allowingReadAccessToURL:[[NSBundle mainBundle] bundleURL]];
              } else {
                  [webView loadRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:@"http://212.16.94.59:3000/index.html"]]];
              }
              
              [vc.view addSubview:webView];
          }

          @interface SceneDelegate : UIResponder <UIWindowSceneDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation SceneDelegate
          - (void)scene:(UIScene *)scene willConnectToSession:(UISceneSession *)session options:(UISceneConnectionOptions *)connectionOptions {
              if (![scene isKindOfClass:[UIWindowScene class]]) return;
              UIWindowScene *windowScene = (UIWindowScene *)scene;
              
              self.window = [[UIWindow alloc] initWithWindowScene:windowScene];
              UIViewController *vc = [[UIViewController alloc] init];
              SetupWebViewOnViewController(vc);
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
          }
          @end

          @interface CarPlaySceneDelegate : UIResponder <CPTemplateApplicationSceneDelegate>
          @property (strong, nonatomic) CPInterfaceController *interfaceController;
          @end

          @implementation CarPlaySceneDelegate
          - (void)templateApplicationScene:(CPTemplateApplicationScene *)templateApplicationScene didConnectInterfaceController:(CPInterfaceController *)interfaceController {
              self.interfaceController = interfaceController;
              
              CPListItem *item1 = [[CPListItem alloc] initWithText:@"🎛️ 35 DDP 257 DJ Konsolu" detailText:@"Party Accelerator & Bomba Aktif"];
              CPListItem *item2 = [[CPListItem alloc] initWithText:@"🎵 Çalan Parça (Now Playing)" detailText:@"Spotify Canlı Senkron"];
              
              item2.handler = ^(id<CPSelectableListItem> item, dispatch_block_t completionBlock) {
                  [interfaceController pushTemplate:[CPNowPlayingTemplate sharedTemplate] animated:YES completion:nil];
                  completionBlock();
              };
              
              CPListSection *section = [[CPListSection alloc] initWithItems:@[item1, item2] header:@"BMW 35 DDP 257 • DJ CONSOLE" sectionIndexTitle:nil];
              CPListTemplate *listTemplate = [[CPListTemplate alloc] initWithTitle:@"35 DDP 257" sections:@[section]];
              
              [interfaceController setRootTemplate:listTemplate animated:YES completion:nil];
          }

          - (void)templateApplicationScene:(CPTemplateApplicationScene *)templateApplicationScene didDisconnectInterfaceController:(CPInterfaceController *)interfaceController {
              self.interfaceController = nil;
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryPlayback withOptions:AVAudioSessionCategoryOptionMixWithOthers error:nil];
              [[AVAudioSession sharedInstance] setActive:YES error:nil];
              
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              UIViewController *vc = [[UIViewController alloc] init];
              SetupWebViewOnViewController(vc);
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              return YES;
          }

          - (UISceneConfiguration *)application:(UIApplication *)application configurationForConnectingSceneSession:(UISceneSession *)connectingSceneSession options:(UISceneConnectionOptions *)options {
              if ([connectingSceneSession.role isEqualToString:@"CPTemplateApplicationSceneSessionRoleApplication"]) {
                  return [[UISceneConfiguration alloc] initWithName:@"CarPlay" sessionRole:connectingSceneSession.role];
              }
              return [[UISceneConfiguration alloc] initWithName:@"Default" sessionRole:connectingSceneSession.role];
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # Compile genuine ARM64 Mach-O iOS binary
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=16.0 -fobjc-arc -framework UIKit -framework WebKit -framework AVFoundation -framework CarPlay -o build/Payload/35DDP257.app/35DDP257 main.m

          # Clean and resolve Info.plist
          cp App/Info.plist build/Payload/35DDP257.app/Info.plist
          plutil -replace CFBundleExecutable -string "35DDP257" build/Payload/35DDP257.app/Info.plist
          plutil -replace CFBundleName -string "35DDP257" build/Payload/35DDP257.app/Info.plist
          plutil -replace CFBundleIdentifier -string "com.antigravity.dj.35DDP257" build/Payload/35DDP257.app/Info.plist
          plutil -replace CFBundlePackageType -string "APPL" build/Payload/35DDP257.app/Info.plist
          plutil -replace CFBundleDevelopmentRegion -string "en" build/Payload/35DDP257.app/Info.plist
          
          # Force Fullscreen on iPhone 13 (Native Screen Resolution & LaunchScreen)
          plutil -insert UILaunchScreen -xml '<dict/>' build/Payload/35DDP257.app/Info.plist || true
          plutil -insert UIDeviceFamily -xml '<array><integer>1</integer><integer>2</integer></array>' build/Payload/35DDP257.app/Info.plist || true
          plutil -replace UIRequiresFullScreen -bool true build/Payload/35DDP257.app/Info.plist || true

          # Exact Scene Configuration for both Phone Window and CarPlay
          plutil -replace UIApplicationSceneManifest -xml '<dict><key>UIApplicationSupportsMultipleScenes</key><true/><key>UISceneConfigurations</key><dict><key>UIWindowSceneSessionRoleApplication</key><array><dict><key>UISceneConfigurationName</key><string>Default</string><key>UISceneDelegateClassName</key><string>SceneDelegate</string></dict></array><key>CPTemplateApplicationSceneSessionRoleApplication</key><array><dict><key>UISceneConfigurationName</key><string>CarPlay</string><key>UISceneDelegateClassName</key><string>CarPlaySceneDelegate</string></dict></array></dict></dict>' build/Payload/35DDP257.app/Info.plist
          
          # Enable App Transport Security for remote calls
          plutil -insert NSAppTransportSecurity -xml "<dict><key>NSAllowsArbitraryLoads</key><true/></dict>" build/Payload/35DDP257.app/Info.plist || true

          # Copy Web UI & Assets directly inside bundle for instant local loading
          cp preview/index.html build/Payload/35DDP257.app/index.html || true
          cp preview/carplay.html build/Payload/35DDP257.app/carplay.html || true
          cp *.mp3 build/Payload/35DDP257.app/ 2>/dev/null || true
          cp preview/*.mp3 build/Payload/35DDP257.app/ 2>/dev/null || true
          cp *.wav build/Payload/35DDP257.app/ 2>/dev/null || true
          cp *.png build/Payload/35DDP257.app/ 2>/dev/null || true
          cp preview/*.png build/Payload/35DDP257.app/ 2>/dev/null || true

          chmod +x build/Payload/35DDP257.app/35DDP257

          cd build && zip -r 35DDP257.ipa Payload/
          echo "IPA Basariyla Olusturuldu!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 35DDP257-IPA
          path: build/35DDP257.ipa
